<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Essai emblèmes — Socle des Cocktails</title>
<style>
@font-face { font-family: "Bebas Neue"; src: url(fonts/bebas-neue.woff2) format("woff2"); font-display: swap; }
@font-face { font-family: "DM Sans"; src: url(fonts/dm-sans-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "DM Sans"; src: url(fonts/dm-sans-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
:root { --bg: #FAF8F4; --gold: #D4A017; --gold-ink: #8C6508; --dark: #1D1B18; --muted: #5F5A52; --line: #E7E1D6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--dark); font-family: "DM Sans", system-ui, sans-serif; line-height: 1.5; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 80px; }
.eyebrow { margin: 0 0 6px; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; }
h1.page { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: clamp(44px, 7vw, 76px); line-height: .95; margin: 0 0 10px; }
.intro { color: var(--muted); max-width: 62ch; margin: 0 0 8px; }
section.variante { margin-top: 44px; padding-top: 24px; border-top: 1px solid var(--line); }
.variante > h2 { margin: 0 0 4px; font-size: 20px; }
.variante > h2 span { display: inline-block; min-width: 30px; height: 30px; line-height: 30px; text-align: center; border-radius: 50%; background: var(--dark); color: #fff; font-size: 16px; margin-right: 8px; }
.variante > p { margin: 0 0 20px; color: var(--muted); }
.titres { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.titre { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px 22px 18px; }
.titre small { display: block; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-ink); font-weight: 700; margin-bottom: 6px; }
.nom { font-family: "Bebas Neue", Impact, sans-serif; font-weight: 400; font-size: clamp(46px, 5.6vw, 64px); line-height: .9; letter-spacing: .5px; margin: 0; }
.ico { color: var(--gold); flex: none; display: inline-block; }
.ico svg { display: block; width: 100%; height: 100%; }

/* A — à côté du nom */
.vA .titre .ico { width: .6em; height: .6em; margin-left: .16em; vertical-align: -.02em; }

/* B — au-dessus, comme un emblème */
.vB .ico { width: 46px; height: 46px; margin-bottom: 10px; }

/* C — médaillon rond */
.vC .nom { display: flex; align-items: center; gap: 14px; }
.vC .ico { width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--gold); padding: 12px; background: #FBF3DD; color: var(--gold-ink); }

/* Galerie miniature */
.mini { margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.carte { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 8px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.carte img { width: 100%; aspect-ratio: 1; object-fit: contain; mix-blend-mode: multiply; }
.carte .n { font-family: "Bebas Neue", Impact, sans-serif; font-size: 22px; line-height: 1; display: flex; align-items: center; justify-content: center; gap: 6px; }
.vA .carte .ico { width: 21px; height: 21px; }
.vB .carte .n { flex-direction: column; gap: 4px; }
.vB .carte .ico { width: 28px; height: 28px; margin: 0; }
.vC .carte .ico { width: 36px; height: 36px; padding: 6px; border-width: 1.5px; }
.vC .carte .n { flex-direction: column; gap: 6px; }
@media (max-width: 640px) { .mini { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Essai · Socle des Cocktails</p>
  <h1 class="page">Les emblèmes des cocktails</h1>
  <p class="intro">Même police, un petit pictogramme doré propre à chaque cocktail. Trois placements possibles, chacun montré en grand (titre de la fiche) puis en petit (galerie).</p>

  <div id="variantes"></div>
</div>

<!-- Pictogrammes : trait 2, viewBox 48 × 48, couleur héritée -->
<template id="pictos">
  <svg data-k="aviation" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M9 22.6 H37 C41 22.6 42.6 23.4 42.6 24 C42.6 24.6 41 25.4 37 25.4 H9 Z"/>
    <path d="M21 22.6 L15.5 9.5 H19.5 L29.5 22.6"/>
    <path d="M21 25.4 L15.5 38.5 H19.5 L29.5 25.4"/>
    <path d="M10 22.6 L6.5 16 H9.5 L14 22.6"/>
    <path d="M10 25.4 L6.5 32 H9.5 L14 25.4"/>
    <path d="M45 18.5 V29.5"/>
  </svg>
  <svg data-k="manhattan" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 43 H44"/>
    <path d="M19 43 V17 H21 V12 H22.6 V4.5 H23.4 V12 H25 V17 H27 V43"/>
    <path d="M19 43 V27 H10 V43"/>
    <path d="M27 43 V22 H36 V43"/>
    <path d="M36 43 V32 H40.5 V43"/>
    <path d="M22 23 H24 M22 29 H24 M22 35 H24 M30 28 H33 M30 34 H33 M13 32 H16"/>
  </svg>
  <svg data-k="dark-and-stormy" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M14 29 H34.5 A6.5 6.5 0 0 0 33.5 16.1 A9.5 9.5 0 0 0 15.5 14.6 A7.3 7.3 0 0 0 14 29 Z"/>
    <path d="M25.5 25 L19.5 35 H24.5 L21.5 44.5 L31 32 H26 L29 25 Z" fill="currentColor"/>
  </svg>
  <svg data-k="mojito" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M24 40 C11 32 10.5 15 24 5 C37.5 15 37 32 24 40 Z"/>
    <path d="M24 46 V10"/>
    <path d="M24 17 L19 13.5 M24 17 L29 13.5 M24 24.5 L17 20 M24 24.5 L31 20 M24 32 L18.5 28.5 M24 32 L29.5 28.5"/>
  </svg>
</template>

<script>
(function () {
  var cocktails = [
    { s: "aviation", n: "Aviation", cat: "Short drink" },
    { s: "manhattan", n: "Manhattan", cat: "Short drink" },
    { s: "dark-and-stormy", n: "Dark and Stormy", cat: "Long drink" },
    { s: "mojito", n: "Mojito", cat: "Long drink" }
  ];
  var tpl = document.getElementById("pictos").content;
  function picto(k) { return '<span class="ico">' + tpl.querySelector('[data-k="' + k + '"]').outerHTML + "</span>"; }
  var vars = [
    { c: "vA", t: "À côté du nom", d: "Le pictogramme suit le nom sur la même ligne, comme un logo." },
    { c: "vB", t: "Au-dessus du nom", d: "Petit emblème posé au-dessus du titre, comme un blason." },
    { c: "vC", t: "Médaillon rond", d: "Le pictogramme dans une pastille dorée, à gauche du nom : effet « tampon »." }
  ];
  document.getElementById("variantes").innerHTML = vars.map(function (v, i) {
    var titres = cocktails.map(function (c) {
      var nom = v.c === "vB" ? picto(c.s) + '<h2 class="nom">' + c.n + "</h2>"
              : v.c === "vC" ? '<h2 class="nom">' + picto(c.s) + "<span>" + c.n + "</span></h2>"
              : '<h2 class="nom"><span>' + c.n + "</span>" + picto(c.s) + "</h2>";
      return '<div class="titre"><small>' + c.cat + "</small>" + nom + "</div>";
    }).join("");
    var mini = cocktails.map(function (c) {
      var n = v.c === "vA" ? "<span>" + c.n + "</span>" + picto(c.s) : picto(c.s) + "<span>" + c.n + "</span>";
      return '<div class="carte"><img src="img/cocktails/' + c.s + '.jpg" alt=""><div class="n">' + n + "</div></div>";
    }).join("");
    return '<section class="variante ' + v.c + '"><h2><span>' + (i + 1) + "</span>" + v.t + "</h2><p>" + v.d + '</p><div class="titres">' + titres + '</div><div class="mini">' + mini + "</div></section>";
  }).join("");
})();
</script>
</body>
</html>
